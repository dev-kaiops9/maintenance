<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Sedang Tidak Dapat Diakses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#f4f5f7;
    --bg-1:#ffffff;
    --line:#dde1e8;
    --line-soft:#e8eaef;
    --ink:#1b1e27;
    --muted:#6b7280;
    --accent:#e0433f;
    --accent-dim:rgba(224,67,63,.09);
    --ok:#1f9c86;
    --ok-dim:rgba(31,156,134,.1);
    --track-y:66px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
  }

  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, #ffffff 0%, transparent 60%),
      var(--bg-0);
  }

  /* faint schematic grid, like a track/signal blueprint */
  .grid{
    position:absolute;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 80%);
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 80%);
    opacity:.6;
  }

  .stage{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 6vw 22vh;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    font-family:'Space Mono',monospace;
    font-size:clamp(.62rem, 1.3vw, .74rem);
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-dim);
    border:1px solid rgba(224,67,63,.22);
    padding:.5rem 1rem;
    border-radius:999px;
    margin-bottom:1.8rem;
  }

  .signal-lamp{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 6px 1px rgba(224,67,63,.45);
    animation:blink 1.3s steps(1,end) infinite;
  }
  .signal-lamp.b{ animation-delay:.65s; }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:.15; box-shadow:none; }
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    line-height:1.12;
    letter-spacing:-.01em;
    font-size:clamp(1.9rem, 5vw, 3.2rem);
    margin:0 0 1.1rem;
    max-width:20ch;
    color:var(--ink);
  }

  h1 .accent{
    color:var(--accent);
  }

  p.sub{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:clamp(.92rem, 1.5vw, 1.05rem);
    color:var(--muted);
    max-width:42ch;
    margin:0 0 2.2rem;
    line-height:1.65;
  }

  .status-board{
    display:inline-flex;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:clamp(.68rem, 1.2vw, .78rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ok);
    background:var(--ok-dim);
    border:1px solid rgba(31,156,134,.28);
    padding:.6rem 1.2rem;
    border-radius:999px;
  }

  .status-board .dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--ok);
    margin-right:.6rem;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }

  /* ---------- Railway (signature element) ---------- */
  .railway{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:200px;
    z-index:1;
    overflow:hidden;
  }

  .rail-line{
    position:absolute;
    left:0;
    right:0;
    bottom:var(--track-y);
    height:2px;
    background:linear-gradient(90deg, transparent 0%, rgba(224,67,63,.55) 8%, rgba(224,67,63,.55) 92%, transparent 100%);
    box-shadow:0 0 8px 1px rgba(224,67,63,.16);
  }

  .ties{
    position:absolute;
    left:0;
    right:0;
    bottom:calc(var(--track-y) - 11px);
    height:9px;
    background-image:repeating-linear-gradient(
      90deg,
      var(--line) 0px,
      var(--line) 4px,
      transparent 4px,
      transparent 40px
    );
    opacity:.7;
  }

  /* nose points right; the train travels left-to-right, front leading */
  .train-wrap{
    position:absolute;
    bottom:calc(var(--track-y) - 6px);
    left:-46%;
    animation:run 16s linear infinite;
    will-change:transform;
  }

  @keyframes run{
    0%{ left:-46%; }
    100%{ left:112%; }
  }

  .train-wrap svg{
    display:block;
    width:min(46vw, 560px);
    height:auto;
    position:relative;
    z-index:1;
  }

  /* soft contact shadow grounding the wheels to the rail; moves with the train */
  .train-wrap .contact-shadow{
    position:absolute;
    left:2%;
    right:2%;
    bottom:-4px;
    height:10px;
    background:radial-gradient(ellipse closest-side, rgba(0,0,0,.6), transparent 75%);
    filter:blur(2px);
    z-index:0;
  }

  /* speed lines trail behind the train, i.e. on the left (rear) side */
  .speed-line{
    position:absolute;
    top:38%;
    height:2px;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--accent) 70%, transparent);
    opacity:0;
    animation:trail 1s ease-out infinite;
    z-index:0;
  }
  .speed-line.sl1{ right:100%; width:44px; margin-right:8px; animation-delay:0s; }
  .speed-line.sl2{ right:100%; width:28px; margin-right:8px; top:56%; animation-delay:.18s; }
  .speed-line.sl3{ right:100%; width:56px; margin-right:8px; top:70%; animation-delay:.34s; }

  @keyframes trail{
    0%{ opacity:0; transform:translateX(14px) scaleX(.4); }
    30%{ opacity:.55; }
    100%{ opacity:0; transform:translateX(-24px) scaleX(1); }
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:.66rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.55;
    padding:0 0 1.4rem;
  }

  @media (max-width:640px){
    .stage{ padding:8vh 6vw 26vh; }
    .railway{ height:170px; }
    .train-wrap svg{ width:78vw; }
  }

  @media (prefers-reduced-motion: reduce){
    .train-wrap{ animation-duration:46s; }
    .speed-line,.signal-lamp,.status-board .dot{ animation:none; opacity:.8; }
  }
</style>
</head>
